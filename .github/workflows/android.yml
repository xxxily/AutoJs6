name: Android CI

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install CMake 3.10.2 manually
        env:
          CMAKE_INSTALLER_SHA256: 9348039642fc0213f4dd4235e513adc8ffbe6424ee98f349db17ca2a523a5d1b
        run: |
          wget -O cmake-3.10.2-Linux-x86_64.sh https://cmake.org/files/v3.10/cmake-3.10.2-Linux-x86_64.sh
          echo "${CMAKE_INSTALLER_SHA256}  cmake-3.10.2-Linux-x86_64.sh" | sha256sum --check
          chmod +x cmake-3.10.2-Linux-x86_64.sh
          sudo ./cmake-3.10.2-Linux-x86_64.sh --skip-license --prefix=/usr/local
          
      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run architecture governance gates
        run: ./gradlew testAppDebugUnitTest --tests org.autojs.autojs.ai.docs.AiCapabilityIndexConsistencyTest --tests org.autojs.autojs.runtime.ResourceScopeTest --tests org.autojs.autojs.compat.ReleaseSmokeGateTest compileAppDebugAndroidTestKotlin

      - name: Run debug build and unit tests
        run: ./gradlew testAppDebugUnitTest assembleAppDebug

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validation
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install CMake 3.10.2 manually
        env:
          CMAKE_INSTALLER_SHA256: 9348039642fc0213f4dd4235e513adc8ffbe6424ee98f349db17ca2a523a5d1b
        run: |
          wget -O cmake-3.10.2-Linux-x86_64.sh https://cmake.org/files/v3.10/cmake-3.10.2-Linux-x86_64.sh
          echo "${CMAKE_INSTALLER_SHA256}  cmake-3.10.2-Linux-x86_64.sh" | sha256sum --check
          chmod +x cmake-3.10.2-Linux-x86_64.sh
          sudo ./cmake-3.10.2-Linux-x86_64.sh --skip-license --prefix=/usr/local

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare signing config
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Signing secrets are required for release APK builds."
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.jks
          {
            echo "storeFile=../release.jks"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
          } > sign.properties

      - name: Build with Gradle (assembleInrtRelease)
        run: ./gradlew assembleInrtRelease

      - name: Build with Gradle (assembleAppRelease)
        run: ./gradlew assembleAppRelease

      - name: Verify app release APK signatures
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/app/release/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "No app release APKs were produced."
            exit 1
          fi

          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$apksigner" ]; then
            echo "apksigner was not found in ANDROID_HOME/build-tools."
            exit 1
          fi

          for apk in "${apks[@]}"; do
            "$apksigner" verify --verbose "$apk"
          done

      - name: Upload app release APKs
        uses: actions/upload-artifact@v7
        with:
          name: release-app-apks
          path: app/build/outputs/apk/app/release/*.apk
          if-no-files-found: error
